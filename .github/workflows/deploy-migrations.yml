name: Deploy Database Migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3

      - name: Push migrations
        run: |
          supabase db push --db-url "postgresql://postgres.hrbxzjtdzqvgsditfnob:${{ secrets.DB_PASSWORD }}@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require"
